[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Content-Disposition = "attachment"
    Cache-Control = "public, max-age=3600"


[[redirects]]
  from = "/control"
  to = "/rlx-control.html"
  status = 200

[[redirects]]
  from = "/blenderfied"
  to = "/blenderfied.html"
  status = 200


[[edge_functions]]
  function = "analytics"
  path = "/api/analytics"
